name: Android Build

on:
  workflow_dispatch:
  push:
    branches: [ android-build ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake ccache

      - name: Grant execute permission for gradlew
        run: |
          if [ -f Android/gradlew ]; then
            chmod +x Android/gradlew
          fi

      - name: Build APK with Gradle
        working-directory: Android
        run: ./gradlew assembleDebug --stacktrace

      - name: Dump CMake Logs on Failure
        if: failure()
        run: |
          echo "==================== LOGS DE ERROR DE CMAKE ===================="
          find Android/app/.cxx -name "build_model.json" -exec cat {} + 2>/dev/null || true
          find Android/app/.cxx -name "*.log" -exec tail -n 100 {} + 2>/dev/null || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: 2Ship2Harkinian-Android-APK
          path: Android/app/build/outputs/apk/**/*.apk
